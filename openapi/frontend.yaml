      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - 'Tenant no encontrado'
                examples:
                  -
                    error: 'Tenant no encontrado'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subdomain:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 63 characters.'
                  examples:
                    - b
              required:
                - subdomain
      security: []
    parameters:
      -
        in: path
        name: subdomain
        description: ''
        required: true
        schema:
          type: string
          examples:
            - architecto
