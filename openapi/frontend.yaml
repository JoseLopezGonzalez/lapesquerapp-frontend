openapi: 3.1.0
info:
  title: 'PesquerApp API — Contrato Frontend'
  description: 'Subconjunto de la API REST v2 de PesquerApp destinado a aplicaciones cliente (Next.js, app móvil). No incluye rutas de superadmin, impersonación ni observabilidad interna.'
  version: 1.0.0
  contact:
    name: 'PesquerApp Support'
    email: support@pesquerapp.com
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Products
    description: 'Gestión de productos (familias, especies, zonas de captura).'
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén tu token mediante el endpoint de login. Incluye el token en el header Authorization con el prefijo "Bearer ".'
security:
  -
    default: []
paths:
  /api/v2/products/options:
    get:
      summary: 'Opciones para select (id, name, boxGtin).'
      operationId: opcionesParaSelectidNameBoxGtin
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses:
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                  userMessage:
                    type: string
                    examples:
                      - 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
                examples:
                  -
                    message: 'Too Many Attempts.'
                    userMessage: 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
      tags:
        - Products
  /api/v2/products:
    get:
      summary: 'Listar productos'
      operationId: listarProductos
      description: ''
      parameters:
        -
          in: query
          name: id
          description: 'ID del producto.'
          required: false
          schema:
            type: integer
            description: 'ID del producto.'
            examples:
              - 16
        -
          in: query
          name: ids
          description: 'Lista de IDs.'
          required: false
          schema:
            type: array
            description: 'Lista de IDs.'
            items:
              type: string
            examples:
              -
                - architecto
        -
          in: query
          name: name
          description: 'Filtrar por nombre (parcial).'
          required: false
          schema:
            type: string
            description: 'Filtrar por nombre (parcial).'
            examples:
              - architecto
        -
          in: query
          name: species
          description: 'IDs de especies.'
          required: false
          schema:
            type: array
            description: 'IDs de especies.'
            items:
              type: string
            examples:
              -
                - architecto
        -
          in: query
          name: categories
          description: 'IDs de categorías.'
          required: false
          schema:
            type: array
            description: 'IDs de categorías.'
            items:
              type: string
            examples:
              -
                - architecto
        -
          in: query
          name: families
          description: 'IDs de familias.'
          required: false
          schema:
            type: array
            description: 'IDs de familias.'
            items:
              type: string
            examples:
              -
                - architecto
        -
          in: query
          name: perPage
          description: 'Elementos por página.'
          required: false
          schema:
            type: integer
            description: 'Elementos por página.'
            examples:
              - 14
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses:
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                  userMessage:
                    type: string
                    examples:
                      - 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
                examples:
                  -
                    message: 'Too Many Attempts.'
                    userMessage: 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
      tags:
        - Products
    post:
      summary: ''
      operationId: postApiV2Products
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses: {  }
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  examples:
                    - b
                speciesId:
                  type: string
                  description: 'The <code>id</code> of an existing record in the tenant.species table.'
                  examples:
                    - architecto
                captureZoneId:
                  type: string
                  description: 'The <code>id</code> of an existing record in the tenant.capture_zones table.'
                  examples:
                    - architecto
                familyId:
                  type:
                    - string
                    - 'null'
                  description: 'The <code>id</code> of an existing record in the tenant.product_families table.'
                  examples:
                    - null
                articleGtin:
                  type:
                    - string
                    - 'null'
                  description: 'Must match the regex /^[0-9]{13}$/. Must be 13 characters.'
                  examples:
                    - ngzmiyvdljnik
                boxGtin:
                  type:
                    - string
                    - 'null'
                  description: 'Must match the regex /^[0-9]{14}$/. Must be 14 characters.'
                  examples:
                    - hwaykcmyuwpwlv
                palletGtin:
                  type:
                    - string
                    - 'null'
                  description: 'Must match the regex /^[0-9]{8,14}$/. Must not be greater than 14 characters.'
                  examples:
                    - qwrsitcpscqldz
                a3erp_code:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - s
                facil_com_code:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - 'n'
                hsCode:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - r
              required:
                - name
                - speciesId
                - captureZoneId
    delete:
      summary: ''
      operationId: deleteApiV2Products
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses: {  }
      tags:
        - Products
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: ''
                  items:
                    type: integer
                  examples:
                    -
                      - 16
