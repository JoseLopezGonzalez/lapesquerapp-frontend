      description: "Parámetros esperados (query params):\n- groupBy: string (client | country | product) → define cómo agrupar los resultados\n- valueType: string (totalAmount | totalQuantity) → define si se ordena por importe o cantidad\n- dateFrom: string (formato YYYY-MM-DD) → fecha de inicio del rango\n- dateTo: string (formato YYYY-MM-DD) → fecha final del rango\n- speciesId: int|null (opcional) → ID de la especie por la que filtrar\n\nFormato de respuesta:\n[\n  {\n    \"name\": \"Cliente A | España | Producto X\",\n    \"value\": float // totalAmount o totalQuantity según valueType\n  },\n  ...\n]\n\nEjemplo de respuesta con groupBy=client y valueType=totalAmount:\n[\n  { \"name\": \"Congelados Brisamar\", \"value\": 12830.50 },\n  { \"name\": \"Frostmar S.L.\", \"value\": 9740.00 },\n  ...\n]"
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses:
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                  userMessage:
                    type: string
                    examples:
                      - 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
                examples:
                  -
                    message: 'Too Many Attempts.'
                    userMessage: 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupBy:
                  type: string
                  description: ''
                  enum:
                    - client
                    - country
                    - product
                  examples:
                    - client
                valueType:
                  type: string
                  description: ''
                  enum:
                    - totalAmount
                    - totalQuantity
                  examples:
                    - totalAmount
                dateFrom:
                  type: string
                  description: 'Must be a valid date.'
                  examples:
                    - '2026-08-13T13:54:24'
                dateTo:
                  type: string
                  description: 'Must be a valid date.'
                  examples:
                    - '2026-08-13T13:54:24'
                speciesId:
                  type:
                    - integer
                    - 'null'
                  description: 'The <code>id</code> of an existing record in the tenant.species table.'
                  examples:
                    - 16
              required:
                - groupBy
                - valueType
                - dateFrom
                - dateTo
