  '/api/v2/toll-clients/branding/{slug}':
    get:
      summary: "Branding público de un cliente de maquila, para pintar la pantalla de login del portal antes\nde autenticar (imagen grande a la izquierda del formulario). Requiere X-Tenant (resuelto por\nel middleware `tenant` del grupo v2, igual que /v2/login), pero no requiere sesión — mismo\npatrón que Public\\TenantController::showBySubdomain(). No expone nada sensible: nombre y URLs\nde imagen son equivalentes a lo que ya se ve en el propio portal público de la empresa."
      operationId: 
