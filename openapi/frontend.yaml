      description: "Parámetros esperados (query params):\n- dateFrom: string (formato YYYY-MM-DD) → fecha de inicio del rango\n- dateTo: string (formato YYYY-MM-DD) → fecha final del rango\n- valueType: string (amount | quantity) → tipo de valor a retornar\n- groupBy: string (day | week | month) → agrupación temporal (default: day)\n- speciesId: int|null (opcional) → ID de la especie por la que filtrar\n- familyId: int|null (opcional) → ID de la familia por la que filtrar\n- categoryId: int|null (opcional) → ID de la categoría por la que filtrar\n\nFormato de respuesta:\n[\n  {\n    \"date\": \"2025-01-01\",\n    \"value\": 1234.56\n  },\n  ...\n]"
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses:
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                  userMessage:
                    type: string
                    examples:
                      - 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
                examples:
                  -
                    message: 'Too Many Attempts.'
                    userMessage: 'Has realizado demasiadas solicitudes. Por favor, espera un momento antes de intentar nuevamente.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dateFrom:
                  type: string
                  description: 'Must be a valid date.'
                  examples:
                    - '2026-08-13T13:54:24'
                dateTo:
                  type: string
                  description: 'Must be a valid date.'
                  examples:
                    - '2026-08-13T13:54:24'
                speciesId:
                  type:
                    - integer
                    - 'null'
                  description: 'The <code>id</code> of an existing record in the tenant.species table.'
                  examples:
                    - 16
                familyId:
                  type:
                    - integer
                    - 'null'
                  description: 'The <code>id</code> of an existing record in the tenant.product_families table.'
                  examples:
                    - 16
                categoryId:
                  type:
                    - integer
                    - 'null'
                  description: 'The <code>id</code> of an existing record in the tenant.product_categories table.'
                  examples:
                    - 16
                valueType:
                  type: string
                  description: ''
                  enum:
                    - amount
                    - quantity
                  examples:
                    - quantity
                groupBy:
                  type:
                    - string
                    - 'null'
                  description: ''
                  enum:
                    - day
                    - week
                    - month
                  examples:
                    - day
              required:
                - dateFrom
                - dateTo
                - valueType
