                  examples:
                    - qwrsitcpscqldz
                a3erp_code:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - s
                facil_com_code:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - 'n'
                hsCode:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
                    - r
    delete:
      summary: ''
      operationId: deleteApiV2ProductsId
      description: ''
      parameters:
        -
          in: header
          name: X-Tenant
          description: ''
          schema:
            type: string
            examples:
              - demo-tenant
      responses: {  }
      tags:
        - Products
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the product.'
        required: true
        schema:
          type: string
          examples:
            - architecto
  '/api/v2/public/tenant/{subdomain}':
    get:
